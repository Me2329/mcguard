org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# --- plugin identity ---------------------------------------------------------
plugin_id=mcguard
plugin_name=McGuard
plugin_version=1.0.0
plugin_group=com.mcserver.mcguard
plugin_author=Mc_Server

# --- target platform ---------------------------------------------------------
# Compiled against the Paper API, which is a superset of the Spigot/Bukkit API.
# The resulting jar runs on CraftBukkit, Spigot, Paper, Purpur, Pufferfish,
# Folia and hybrids (Arclight, Mohist) - anything that loads Bukkit plugins.
# Paper-only and Folia-only calls are guarded at runtime so nothing links on a
# platform that lacks them.
minecraft_version=1.20.1
paper_api_version=1.20.1-R0.1-SNAPSHOT
